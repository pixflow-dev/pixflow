[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
# VerifiedBuyRouter needs via-IR (same as the solc-js build in
# scripts/compile-contracts.mjs and the same as Pons itself): the
# BuyVerified event emission overflows the stack on the legacy pipeline.
via_ir = true
# Allow importing the real contracts (audited source, outside this dir)
fs_permissions = [{ access = "read", path = "../contracts" }]
